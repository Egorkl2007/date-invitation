<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Приглашение на свидание</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Marck+Script&family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #3a2820;
    --heart-red: #e63946;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #fdfbfb 0%, #fceee9 50%, #f7dcd4 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    font-family: 'Cormorant Garamond', serif;
    color: #5a4a42;
    padding: 20px 15px 60px;
    overflow-x: hidden;
    position: relative;
  }

  .card {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.7);
    border-radius: 30px;
    padding: 50px 24px 45px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    box-shadow: 0 15px 40px rgba(200, 150, 140, 0.25);
    animation: fadeIn 1.2s ease-out;
    position: relative;
    z-index: 2;
  }

  .raccoon {
    position: absolute;
    width: 80px;
    height: 80px;
    animation: bobble 3s ease-in-out infinite;
    z-index: 3;
  }
  .raccoon-tl { top: -28px; left: -18px; }
  .raccoon-tr { top: -32px; right: -18px; animation-delay: 0.5s; }
  .raccoon svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 6px rgba(180,120,110,0.25)); }

  @keyframes bobble {
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
    50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); }
  }
  .raccoon-tl { --rot: -15deg; }
  .raccoon-tr { --rot: 15deg; }

  .deco-heart {
    position: absolute;
    color: var(--heart-red);
    pointer-events: none;
    z-index: 3;
    filter: drop-shadow(0 3px 5px rgba(230, 57, 70, 0.15));
  }
  .deco-heart svg { width: 100%; height: 100%; display: block; }

  .deco-heart-1 {
    width: 90px; height: 90px;
    bottom: -25px; left: -25px;
    animation: bobble 4s ease-in-out infinite;
    --rot: -12deg; transform: rotate(-12deg);
  }
  .deco-heart-2 {
    width: 55px; height: 55px;
    top: 400px; right: -22px;
    animation: bobble 3.5s ease-in-out infinite 0.4s;
    --rot: 18deg; transform: rotate(18deg);
  }
  .deco-heart-3 {
    width: 70px; height: 70px;
    top: -30px; left: 50%;
    margin-left: -35px;
    animation: bobble 4.5s ease-in-out infinite 0.8s;
    --rot: 6deg; transform: rotate(6deg);
    opacity: 0.92;
  }

  .subtitle {
    font-family: 'Marck Script', cursive;
    font-size: 1.9rem;
    color: #c98b83;
    margin-bottom: 12px;
    line-height: 1.15;
    animation: slideUp 1s ease-out 0.3s both;
    padding: 0 10px;
  }

  h1 {
    font-size: 1.55rem;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.35;
    color: #4a3b34;
    animation: slideUp 1s ease-out 0.5s both;
  }

  .place-title {
    font-family: 'Comfortaa', sans-serif;
    font-size: 1.8rem;
    font-weight: 700;
    color: #b36b62;
    margin-bottom: 26px;
    letter-spacing: 0.5px;
    animation: slideUp 1s ease-out 0.7s both;
  }

  .icon {
    color: var(--ink);
    flex-shrink: 0;
    display: block;
  }

  .details {
    background: #fff4f0;
    border-radius: 20px;
    padding: 20px 18px;
    margin-bottom: 20px;
    border: 1.5px dashed #e3b8b0;
    animation: slideUp 1s ease-out 0.9s both;
  }

  .detail-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    margin-bottom: 12px;
    font-size: 1.1rem;
    line-height: 1.35;
    text-align: left;
  }
  .detail-item:last-child { margin-bottom: 0; }

  .detail-icon { width: 22px; height: 22px; }

  .album {
    margin-bottom: 22px;
    padding: 36px 12px 30px;
    background:
      radial-gradient(circle at 15% 20%, rgba(180, 150, 120, 0.18), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(160, 130, 100, 0.15), transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(200, 175, 145, 0.08), transparent 70%),
      #ede2d2;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    animation: slideUp 1s ease-out 1.05s both;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(180,150,120,0.2) 0.5px, transparent 1px),
      radial-gradient(circle at 70% 60%, rgba(180,150,120,0.15) 0.5px, transparent 1px),
      radial-gradient(circle at 40% 80%, rgba(180,150,120,0.18) 0.5px, transparent 1px),
      radial-gradient(circle at 85% 25%, rgba(180,150,120,0.15) 0.5px, transparent 1px),
      radial-gradient(circle at 15% 20%, rgba(180, 150, 120, 0.18), transparent 45%),
      radial-gradient(circle at 85% 75%, rgba(160, 130, 100, 0.15), transparent 50%);
    background-size: 40px 40px, 50px 50px, 45px 45px, 55px 55px, 100% 100%, 100% 100%;
  }

  .album-title {
    font-family: 'Marck Script', cursive;
    font-size: 1.5rem;
    color: #8b6e55;
    text-align: center;
    margin-bottom: 22px;
    letter-spacing: 0.5px;
    opacity: 0.9;
  }

  .polaroids {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 14px;
    padding: 0 6px;
    position: relative;
    z-index: 2;
  }

  .polaroid {
    background: #fefdfb;
    padding: 7px 7px 26px 7px;
    box-shadow:
      0 8px 18px rgba(80, 60, 50, 0.18),
      0 2px 4px rgba(80, 60, 50, 0.1);
    position: relative;
    transition: transform 0.3s ease;
  }

  .polaroid:nth-child(1) { transform: rotate(-5deg) translateY(-2px); }
  .polaroid:nth-child(2) { transform: rotate(4.5deg) translateY(8px); }
  .polaroid:nth-child(3) { transform: rotate(3deg) translateY(-4px); }
  .polaroid:nth-child(4) { transform: rotate(-3.5deg) translateY(6px); }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #d4c4b0;
    overflow: hidden;
    position: relative;
  }
  .photo svg { width: 100%; height: 100%; display: block; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .polaroid-caption {
    position: absolute;
    bottom: 5px;
    left: 0;
    right: 0;
    text-align: center;
    font-family: 'Marck Script', cursive;
    font-size: 0.78rem;
    color: #8b7a68;
    letter-spacing: 0.4px;
    line-height: 1.1;
    padding: 0 4px;
  }

  .tape {
    position: absolute;
    width: 46px;
    height: 14px;
    background: rgba(196, 158, 88, 0.5);
    z-index: 4;
    box-shadow: 0 1px 2px rgba(80, 60, 50, 0.12);
    pointer-events: none;
  }

  .polaroid:nth-child(1) .tape {
    top: -8px; left: 10px;
    transform: rotate(-9deg);
    clip-path: polygon(3% 12%, 97% 4%, 100% 88%, 0 96%);
  }
  .polaroid:nth-child(2) .tape {
    top: -8px; right: 8px;
    transform: rotate(11deg);
    clip-path: polygon(2% 6%, 98% 10%, 100% 92%, 0 88%);
  }
  .polaroid:nth-child(3) .tape {
    top: -8px; left: 50%;
    margin-left: -22px;
    transform: rotate(4deg);
    clip-path: polygon(0 8%, 100% 4%, 98% 90%, 2% 96%);
  }
  .polaroid:nth-child(4) .tape {
    top: -8px; left: 12px;
    transform: rotate(-6deg);
    clip-path: polygon(3% 10%, 97% 6%, 100% 90%, 0 94%);
  }

  .dried-flower {
    position: absolute;
    pointer-events: none;
    z-index: 1;
    opacity: 0.85;
  }
  .dried-flower-1 {
    top: 12px; right: 8px;
    width: 90px; height: 130px;
    transform: rotate(12deg);
  }
  .dried-flower-2 {
    bottom: 14px; left: 6px;
    width: 80px; height: 110px;
    transform: rotate(-18deg);
  }

  .star {
    position: absolute;
    color: #b8a084;
    pointer-events: none;
    opacity: 0.8;
    z-index: 3;
  }
  .star-1 { top: 22%; left: 8%;  width: 9px;  height: 9px;  transform: rotate(15deg); }
  .star-2 { top: 65%; right: 12%; width: 7px;  height: 7px;  transform: rotate(-25deg); }
  .star-3 { bottom: 18%; right: 30%; width: 8px; height: 8px; transform: rotate(40deg); }
  .star-4 { top: 42%; right: 5%; width: 6px;  height: 6px;  transform: rotate(-10deg); }
  .star-5 { bottom: 35%; left: 4%; width: 7px; height: 7px;  transform: rotate(60deg); }

  .plan {
    background: linear-gradient(135deg, #fff8f5 0%, #fff4f0 100%);
    border-radius: 20px;
    padding: 22px 20px 18px;
    margin-bottom: 22px;
    text-align: left;
    border: 1px solid #f5e0d9;
    animation: slideUp 1s ease-out 1.15s both;
    box-shadow: 0 4px 12px rgba(217, 154, 154, 0.1);
  }

  .plan h3 {
    font-family: 'Marck Script', cursive;
    font-size: 1.55rem;
    color: #c98b83;
    text-align: center;
    margin-bottom: 14px;
    font-weight: 400;
  }

  .plan ul { list-style: none; padding: 0; }

  .plan li {
    font-size: 1.05rem;
    padding: 12px 0 12px 40px;
    position: relative;
    color: #6d5b54;
    line-height: 1.45;
    border-bottom: 1px dashed #f5e0d9;
  }
  .plan li:last-child { border-bottom: none; padding-bottom: 0; }

  .plan-icon {
    position: absolute;
    left: 0;
    top: 12px;
    width: 26px;
    height: 26px;
  }

  .requirements {
    background: rgba(255, 244, 240, 0.7);
    border-radius: 20px;
    padding: 20px 20px 18px;
    margin-bottom: 22px;
    text-align: left;
    border: 1px solid #f5e0d9;
    animation: slideUp 1s ease-out 1.25s both;
  }

  .requirements h3 {
    font-family: 'Marck Script', cursive;
    font-size: 1.55rem;
    color: #c98b83;
    text-align: center;
    margin-bottom: 12px;
    font-weight: 400;
  }

  .requirements ul { list-style: none; padding: 0; }

  .requirements li {
    font-size: 1.05rem;
    padding: 6px 0 6px 32px;
    position: relative;
    color: #6d5b54;
    line-height: 1.4;
  }

  .req-icon {
    position: absolute;
    left: 0;
    top: 8px;
    width: 20px;
    height: 20px;
  }
  .req-icon-heart { color: var(--heart-red); }

  .map-wrap {
    margin-bottom: 22px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #f5e0d9;
    box-shadow: 0 6px 16px rgba(200, 150, 140, 0.15);
    animation: slideUp 1s ease-out 1.35s both;
  }

  .map-wrap iframe {
    display: block;
    width: 100%;
    height: 220px;
    border: 0;
    filter: saturate(0.9) hue-rotate(-10deg);
  }

  .map-link {
    display: block;
    font-family: 'Comfortaa', sans-serif;
    font-size: 0.95rem;
    color: #b36b62;
    text-decoration: none;
    margin-top: -12px;
    margin-bottom: 22px;
    padding: 10px;
    border-radius: 12px;
    background: #fff4f0;
    border: 1px solid #f5e0d9;
    transition: background 0.2s;
    animation: slideUp 1s ease-out 1.4s both;
  }
  .map-link:active { background: #fceee9; }

  .question {
    font-family: 'Marck Script', cursive;
    font-size: 2rem;
    color: #b36b62;
    margin-bottom: 20px;
    animation: slideUp 1s ease-out 1.45s both;
    line-height: 1.2;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
    animation: slideUp 1s ease-out 1.55s both;
  }

  .btn {
    background: linear-gradient(135deg, #e8b4b8 0%, #d99a9a 100%);
    color: white;
    border: none;
    padding: 14px 36px;
    font-size: 1.6rem;
    font-family: 'Marck Script', cursive;
    font-weight: 400;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(217, 154, 154, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
    max-width: 320px;
    letter-spacing: 0.5px;
    -webkit-tap-highlight-color: transparent;
    line-height: 1.2;
  }

  .btn:active {
    transform: scale(0.97);
    box-shadow: 0 4px 10px rgba(217, 154, 154, 0.5);
  }

  .btn-secondary {
    background: transparent;
    color: #b36b62;
    border: 2px solid #e8b4b8;
    box-shadow: none;
    font-size: 1.4rem;
  }
  .btn-secondary:active { background: #fff4f0; }

  .success-msg {
    display: none;
    font-family: 'Marck Script', cursive;
    font-size: 1.7rem;
    color: #b36b62;
    text-align: center;
    line-height: 1.4;
    padding: 10px 0;
    animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  .success-msg.show { display: block; }

  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .particle {
    position: fixed;
    bottom: -60px;
    font-size: 30px;
    pointer-events: none;
    z-index: 999;
    will-change: transform, opacity;
    animation: floatParticle 4s ease-out forwards;
  }

  @keyframes floatParticle {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.6); opacity: 0; }
    15% { opacity: 1; transform: translate(calc(var(--tx) * 0.2), -15vh) rotate(60deg) scale(1); }
    100% { transform: translate(var(--tx), -115vh) rotate(var(--rot)) scale(1); opacity: 0; }
  }

  @media (max-width: 380px) {
    .subtitle { font-size: 1.6rem; }
    h1 { font-size: 1.35rem; }
    .place-title { font-size: 1.5rem; }
    .card { padding: 45px 16px 40px; }
    .raccoon { width: 65px; height: 65px; }
    .raccoon-tl { top: -22px; left: -14px; }
    .raccoon-tr { top: -25px; right: -14px; }
    .deco-heart-1 { width: 72px; height: 72px; bottom: -20px; left: -20px; }
    .deco-heart-2 { width: 44px; height: 44px; right: -16px; top: 340px; }
    .deco-heart-3 { width: 56px; height: 56px; top: -24px; margin-left: -28px; }
    .btn { font-size: 1.4rem; }
    .btn-secondary { font-size: 1.25rem; }
    .question { font-size: 1.75rem; }
    .album { padding: 28px 6px 24px; }
    .album-title { font-size: 1.3rem; }
    .polaroids { gap: 14px 10px; padding: 0 2px; }
    .polaroid { padding: 5px 5px 22px 5px; }
    .polaroid-caption { font-size: 0.68rem; }
    .tape { width: 38px; height: 12px; }
  }
</style>
</head>

          <path d="M 14,20 Q 14,14 20,14 Q 26,14 26,20"/>
          <circle cx="20" cy="7" r="1.8"/>
        </g>
      </symbol>
